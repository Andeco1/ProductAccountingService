# Тестовая конфигурация: in-memory H2 вместо внешнего PostgreSQL,
# чтобы `mvn test`/`mvn verify` проходил в CI (Jenkins) без запущенной СУБД.

spring.datasource.url=jdbc:h2:mem:product_accounting;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Liquibase-чейнджлоги написаны под PostgreSQL (UUID, SEQUENCE, nextval),
# поэтому для тестов схему создаёт Hibernate напрямую.
spring.liquibase.enabled=false
